<script>
(() => {
  const P = JSON.parse(document.getElementById('sealed').textContent);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const $ = (id) => document.getElementById(id);
  const msg = (t) => { $('msg').textContent = t; };
  const KEYSTORE = 'iris.door.key';

  async function keyFrom(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.rounds, hash: 'SHA-256' }, base,
      { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data));
    const html = new TextDecoder().decode(plain);
    try { sessionStorage.setItem(KEYSTORE, JSON.stringify(await crypto.subtle.exportKey('jwk', key))); } catch {}
    document.open(); document.write(html); document.close();
  }
  // Unlocked earlier in this tab? Straight in.
  (async () => {
    try {
      const jwk = sessionStorage.getItem(KEYSTORE);
      if (!jwk) return;
      const key = await crypto.subtle.importKey('jwk', JSON.parse(jwk), { name: 'AES-GCM' }, true, ['decrypt']);
      await open(key);
    } catch { try { sessionStorage.removeItem(KEYSTORE); } catch {} }
  })();
  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = $('p').value;
    if (!pw) return;
    $('go').disabled = true; msg('opening…');
    try {
      await open(await keyFrom(pw));
    } catch {
      msg('that is not it');
      $('go').disabled = false; $('p').select();
    }
  });
})();
</script>
